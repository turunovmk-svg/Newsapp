name: Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7
        cache-read-only: false

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK (capture output)
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace --info > build_output.txt 2>&1 || true
        echo "EXIT_CODE=$?" >> build_output.txt
      env:
        GRADLE_OPTS: "-Dorg.gradle.workers.max=2"

    - name: Upload Build Output (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output-${{ github.run_number }}
        path: build_output.txt
        retention-days: 7

    - name: Check Build Status
      run: |
        if grep -q "EXIT_CODE=0" build_output.txt; then
          echo "Build succeeded"
        else
          echo "Build failed"
          cat build_output.txt
          exit 1
        fi

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Build Release AAB (optional)
      continue-on-error: true
      run: |
        if [ -f app/keystore.properties ] || [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          ./gradlew :app:bundleRelease --no-daemon
        else
          echo "No keystore, skipping release build"
        fi

    - name: Upload Release AAB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-release-aab-${{ github.run_number }}
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: ignore
        retention-days: 7