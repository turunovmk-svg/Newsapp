name: Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Build Release AAB (optional)
      continue-on-error: true
      run: |
        if [ -f app/keystore.properties ] || [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          ./gradlew :app:bundleRelease --no-daemon
        else
          echo "No keystore, skipping release build"
        fi

    - name: Upload Release AAB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-release-aab-${{ github.run_number }}
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: ignore
        retention-days: 7