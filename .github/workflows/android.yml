name: NewsApp CI/CD

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: List files
      run: find . -maxdepth 3 -type f | sort

    - name: Check build.gradle
      run: cat app/build.gradle

    - name: Try Gradle build
      run: gradle tasks 2>&1 | head -100

    - name: Build with Gradle
      run: gradle assembleDebug --stacktrace 2>&1 | tail -200

    - name: List APK files
      run: ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK directory does not exist"
    
    - name: List all APKs recursively
      run: find app/build/ -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-debug-apk
        path: app/build/outputs/apk/debug/
        if-no-files-found: error
