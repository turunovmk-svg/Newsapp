# Added a trivial change to force a new build trigger

on:
  push:
    branches: [ "master", "main", "fix/crash-livedata-core", "fix/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: List APK files
      run: find app/build/outputs/apk/debug/ -type f -name "*.apk" 2>/dev/null || echo "No APK files found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: newsapp-debug-apk
        path: app/build/outputs/apk/debug/*.apk
