name: Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -d /opt/gradle gradle-8.2-bin.zip
        echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release AAB
      run: |
        if [ ! -f app/kеystore.properties ] && [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "No keystore provided, building unsigned release AAB"
          gradle bundleRelease --no-daemon || echo "Release build skipped (unsigned)"
        else
          gradle bundleRelease --no-daemon
        fi
      continue-on-error: true

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: ignore
