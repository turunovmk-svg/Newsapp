plugins {
    id 'com.android.application' version '8.1.0'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {

    namespace "com.mikhail.newsapp"
    compileSdk 34
    defaultConfig {
        applicationId "com.mikhail.newsapp"
        minSdk 21
        targetSdk 34
        versionCode (project.hasProperty("VERSION_CODE") ? project.VERSION_CODE.toInteger() : 1)
        versionName (project.hasProperty("VERSION_NAME") ? project.VERSION_NAME : "1.0")
    }

    signingConfigs {
        if (System.getenv("KEYSTORE_BASE64") != null) {
            release {
                storeFile file("/tmp/keystore/newsapp-release.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // единый релизный ключ из GitHub Secrets (если присутствует)
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        debug {
            // debug тоже подписываем релизным ключом (если он есть),
            // чтобы APK ставился поверх предыдущих версий без удаления
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        // Compose compiler 1.5.14 <-> Kotlin 1.9.24 (совместимая пара)
        kotlinCompilerExtensionVersion "1.5.14"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    packagingOptions {
        resources {
            excludes += ["META-INF/{AL2.0,LGPL2.1,DEPENDENCIES,LICENSE,NOTICE,NOTICE.txt,LICENSE.txt,ASL2.0}"]
        }
    }
}

dependencies {
    // Compose 1.7.0 / Material 3 1.3.0.
    // PullToRefreshBox находится ВНУТРИ androidx.compose.material3:material3 (1.3.0+),
    // отдельной библиотеки material3-pulltorefresh не существует.
    implementation "androidx.compose.ui:ui:1.7.0"
    implementation "androidx.compose.ui:ui-text:1.7.0"
    implementation "androidx.compose.ui:ui-graphics:1.7.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.0"
    implementation "androidx.compose.foundation:foundation:1.7.0"
    implementation "androidx.compose.foundation:foundation-layout:1.7.0"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.3.0"
    // Splash Screen API
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.compose.material:material-icons-core:1.7.0"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    // AndroidX core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    // Lifecycle ViewModel + Compose state
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    // Coil для AsyncImage (группа io.coil-kt, артефакт coil-compose)
    implementation "io.coil-kt:coil-compose:2.6.0"
    // OkHttp для сетевых запросов
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Jsoup для HTML-парсинга (Telegram t.me/s превью и др.)
    implementation "org.jsoup:jsoup:1.17.2"
    // Media3 ExoPlayer — видео из Telegram-постов в приложении
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    // YouTube-плеер для просмотра роликов внутри приложения
    implementation "com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0"
    // WorkManager для фоновых уведомлений о новых статьях
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.0"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.7.0"

}
