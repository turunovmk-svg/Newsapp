plugins {
    id 'com.android.application' version '7.3.0'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

android {
    namespace "com.mikhail.newsapp"
    compileSdk 34
    defaultConfig {
        applicationId "com.mikhail.newsapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.10"
    }
    kotlinOptions {
        jvmTarget "17"
    }
}

dependencies {
    implementation "androidx.compose.ui:ui:1.5.0"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.foundation:foundation:1.5.0"
    implementation "androidx.compose.foundation:foundation-layout:1.5.0"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.5.0"
    // Lifecycle ViewModel + Compose state
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"
    implementation "androidx.activity:activity-compose:2.8.0"
    // PullToRefresh for Compose (Material 3 experimental API)
    implementation "androidx.compose.material3:material3-pulltorefresh:1.2.1"
    // Coil for AsyncImage
    implementation "io.coil-kt.coil3:coil3:2.4.0"
    // OkHttp for network requests
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}